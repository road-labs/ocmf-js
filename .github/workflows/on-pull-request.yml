name: On Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: 'on-pull-request-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm run lint

  build-and-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup volta
        uses: volta-cli/action@v5.0.0
      - name: Install node and pnpm
        run: volta install node pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Create build
        run: pnpm run build
      - name: Run tests
        run: pnpm run test
