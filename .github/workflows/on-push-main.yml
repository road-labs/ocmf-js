name: On Push Main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'on-push-main'
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm run lint

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup volta
        uses: volta-cli/action@v5.0.0
      - name: Install node and pnpm
        run: volta install node pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Create build
        run: pnpm run build
      - name: Run tests
        run: pnpm run test
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./examples/web/dist

  deploy-pages:
    name: Deploy to GitHub pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
